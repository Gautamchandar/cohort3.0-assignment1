<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <div class="hamburger">
        <img src="/hamburger.png" alt="menu-bar" height="20">
    </div>
    <div class="pokemon">
        <img src="/pokemon.png" alt="pokemon" height="70">
    </div>
    <div class="sun">
        <img src="/sun.png" alt="sun" height="30">
    </div>
    </header>

    <main>
        <form>
            <div class="icon-search">
                <!-- <img src="/search.png" alt="search-icon" height="30"> -->
            <input type="search" name="" id="" placeholder="Search of a Pokemon">
            </div>
            <div class="icon-dropdown">
                <select name="" id="">
                    <option value="Filter by Type(1)">Filter by Type(1)</option>
                    <option value="Filter by Type(1)">Filter by Type(2)</option>
                </select>
            </div>
        </form>

        <div class="boxes">
            <div class="box">
                <img src="/pkm1.png" alt="" height="">
                <strong>Meowscarada</strong>
                <div class="button-skill"><button style="color: green;">GRASS</button>
                <button class="right-arrow"><img src="/right-arrow.png" alt=""></button>
                </div>
                
            </div>
            <div class="box">
                <img src="/pkm2.png" alt="">
                <strong>Pawniard</strong>
                <div class="button-skill"><button style="color: grey;">DARK / STEEL</button></div>
                
            </div>
            <div class="box">
                <img src="/pkm3.png" alt="">
                <strong>Houndoom</strong>
                <div class="button-skill"><button style="color: red;">DARK / FIRE</button></div>
                
            </div>
            <div class="box">
                <img src="/pkm4.png" alt="">
                <strong>Inkay</strong>
                <div class="button-skill"><button style="color: skyblue;">DARK/PSYCHIC</button></div>
            </div>
            
        </div>
    </main>

    <footer>
        <div class="main-skills">
            <div class="skill">
                <strong>Explore</strong>
                <p>Discover All your <br> favourite Pokemon</p>
            </div>
            <div class="skill">
                <strong>Filter</strong>
                <p>Find Pokemon by <br> types and abilities</p>
            </div>
            <div class="skill">
                <strong>Collection</strong>
                <p>Save and manage <br> your collection</p>
            </div>
            <div class="skill">
                <strong>Stats</strong>
                <p>View stats and learn <br>about Pokemon</p>
            </div>
        </div>
        
        <div class="footer">
            <p>&copy; 2024 Pokemon. All Right Reserved.</p>
        </div>
    </footer>

   
</body>
</html>
